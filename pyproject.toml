[project]
name = "madqaq-sentinel"
version = "0.1.0"
description = "MADQAQ Sentinel M0 conformance proof"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# M1 live perception. Optional so the M0 install stays lightweight.
vision = [
  "opencv-python>=4.10",
  "ultralytics>=8.3",
  "pillow>=10.1",
]

[tool.setuptools.packages.find]
include = ["sentinel*", "apps*", "simulator*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
